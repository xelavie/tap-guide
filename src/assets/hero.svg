<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 580" width="520" height="580">
  <defs>
    <linearGradient id="chromeH" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfcfd"/>
      <stop offset="0.28" stop-color="#e4e8ec"/>
      <stop offset="0.55" stop-color="#a9b0b8"/>
      <stop offset="0.78" stop-color="#d7dce1"/>
      <stop offset="1" stop-color="#8d949c"/>
    </linearGradient>
    <linearGradient id="chromeV" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9aa1a9"/>
      <stop offset="0.22" stop-color="#e9edf0"/>
      <stop offset="0.45" stop-color="#ffffff"/>
      <stop offset="0.7" stop-color="#b9c0c7"/>
      <stop offset="1" stop-color="#8a9199"/>
    </linearGradient>
    <linearGradient id="lever" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#dfe3e7"/>
      <stop offset="1" stop-color="#a7aeb6"/>
    </linearGradient>
    <radialGradient id="flange" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#d3d8dd"/>
      <stop offset="1" stop-color="#9aa1a9"/>
    </radialGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f3ef"/>
      <stop offset="1" stop-color="#ebe6df"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#5a4636" stop-opacity="0.10"/>
    </linearGradient>
  </defs>

  <!-- tiled wall -->
  <rect width="520" height="580" fill="url(#wall)"/>
  <g stroke="#e2dbd1" stroke-width="3">
    <line x1="0" y1="145" x2="520" y2="145"/>
    <line x1="0" y1="290" x2="520" y2="290"/>
    <line x1="0" y1="435" x2="520" y2="435"/>
    <line x1="130" y1="0" x2="130" y2="145"/>
    <line x1="390" y1="0" x2="390" y2="145"/>
    <line x1="260" y1="145" x2="260" y2="290"/>
    <line x1="130" y1="290" x2="130" y2="435"/>
    <line x1="390" y1="290" x2="390" y2="435"/>
    <line x1="260" y1="435" x2="260" y2="580"/>
  </g>
  <rect width="520" height="580" fill="url(#shade)"/>

  <!-- soft shadow on wall -->
  <ellipse cx="270" cy="314" rx="200" ry="18" fill="#5a4636" opacity="0.07"/>

  <!-- shower hose -->
  <path d="M96 300 C 70 360, 60 430, 120 470 C 190 515, 300 500, 340 560 L 350 600" fill="none" stroke="#c9d3d6" stroke-width="20" stroke-linecap="round"/>
  <path d="M96 300 C 70 360, 60 430, 120 470 C 190 515, 300 500, 340 560 L 350 600" fill="none" stroke="#e8eef0" stroke-width="20" stroke-linecap="round" stroke-dasharray="3 6" opacity="0.9"/>
  <path d="M96 300 C 70 360, 60 430, 120 470 C 190 515, 300 500, 340 560 L 350 600" fill="none" stroke="#9fb0b5" stroke-width="2" stroke-linecap="round" opacity="0.5" transform="translate(6 4)"/>

  <!-- wall flanges -->
  <ellipse cx="88" cy="270" rx="30" ry="44" fill="url(#flange)"/>
  <ellipse cx="448" cy="270" rx="30" ry="44" fill="url(#flange)"/>

  <!-- horizontal body -->
  <rect x="88" y="236" width="360" height="68" rx="34" fill="url(#chromeH)"/>
  <rect x="96" y="246" width="344" height="8" rx="4" fill="#ffffff" opacity="0.75"/>
  <!-- end caps -->
  <ellipse cx="96" cy="270" rx="14" ry="34" fill="#c3c9cf"/>
  <ellipse cx="440" cy="270" rx="14" ry="34" fill="#cfd4d9"/>
  <!-- hose connector at left bottom -->
  <rect x="84" y="290" width="26" height="22" rx="6" fill="url(#chromeV)"/>

  <!-- spout (comes forward/down from body) -->
  <path d="M268 296 L 330 296 L 342 392 Q 343 412 324 414 L 286 414 Q 266 412 268 392 Z" fill="url(#chromeV)"/>
  <rect x="280" y="404" width="50" height="14" rx="7" fill="#7f868e"/>
  <rect x="286" y="408" width="38" height="6" rx="3" fill="#5f666d"/>
  <!-- pull diverter knob on spout -->
  <rect x="291" y="324" width="28" height="18" rx="9" fill="url(#chromeH)" stroke="#a3aab2" stroke-width="1.5"/>

  <!-- lever cartridge -->
  <rect x="270" y="196" width="66" height="54" rx="12" fill="url(#chromeV)"/>
  <!-- lever stem -->
  <rect x="284" y="164" width="40" height="44" rx="12" fill="url(#chromeV)"/>
  <!-- lever paddle -->
  <path d="M252 150 Q 248 136 262 132 L 392 112 Q 412 110 414 128 L 414 138 Q 412 152 396 154 L 288 186 Q 270 192 262 178 Z" fill="url(#lever)" stroke="#a0a7af" stroke-width="1.5"/>
  <path d="M266 140 L 396 120" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
  <!-- hot / cold dots -->
  <circle cx="300" cy="150" r="5" fill="#d95544"/>
  <circle cx="380" cy="136" r="5" fill="#3e8cc9"/>
</svg>
